services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-VaultSecure256BitKeyForAES!!!!!!}
      - VAULT_TOKEN_SECRET=${VAULT_TOKEN_SECRET:-vault_preview_token_secret_key}
      - VAULT_SIGNER_PRIVATE_KEY=${VAULT_SIGNER_PRIVATE_KEY}
      - AVALANCHE_FUJI_RPC_URL=${AVALANCHE_FUJI_RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
      - AVALANCHE_REGISTRY_ADDRESS=${AVALANCHE_REGISTRY_ADDRESS}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
    volumes:
      - vault_data:/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
    depends_on:
      - backend
    restart: always

volumes:
  vault_data:
